name: Update Ratings Count

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  push:                  # Run on every push so failures surface immediately
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Scrape and update ratings
        run: node scripts/scrape-ratings.js
        env:
          # Optional: scraping proxy token (free tier available). Set as a repo secret
          # named SCRAPE_API_KEY in Settings → Secrets and variables → Actions.
          # The scraper tries direct first, then falls back to the proxy provider
          # (SCRAPE_PROVIDER defaults to 'crawlbase').
          SCRAPE_API_KEY: ${{ secrets.SCRAPE_API_KEY }}
          SCRAPE_PROVIDER: ${{ vars.SCRAPE_PROVIDER }}
          SCRAPE_JS: ${{ vars.SCRAPE_JS }}
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add js/ratings-data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ratings count [skip ci]"
          git push
